<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ken Burns · To the Cyclorama!</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<!-- Livestream panel, not a printed page: render_book.py and number_pages.py
     skip it because its name does not start with a number.

     Shows one of the book's archival photographs at a time and loops a
     hand-made run of zooms and pans over it, for as long as it is left.
     Pictures: images/kenburns/ (web-sized copies of the SLV scans, the
     stereographs cropped to their left-hand view; thumbnails in thumbs/).
     The handouts are the book's handout sheets rendered as images
     (images/kenburns/handout-*.jpg), so they can be read on the stream.
     The stereograph button in the bottom corner (or H) opens the list of
     photographs and handouts, grouped by the book's parts and pages. -->
<style>
:root {
    /* the book's own colours (css/style.css) */
    --paper: #efe6d2; --paper-light: #f8f3e6; --ink: #003153; --ink-soft: #2f4a63;
    --text: #33291c; --text-muted: #6b6255; --fill-tan: #e7cea2; --fill-tan-soft: #f2e6d0;
    --hazard: #8a3324; --band: #213f77; --card-edge: #d9cbab;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: 'Crimson Text', Georgia, serif; }

/* ---------- the picture: always the whole window ---------- */
#stage { position: fixed; inset: 0; background: #000; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* the warning before a wiggle starts: a card from the book, with a countdown */
#strobe { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
    background: var(--paper); color: var(--text); border: 1px solid var(--card-edge); border-top: 6px solid var(--hazard);
    padding: 2.4vh 3.4vw 2.2vh; box-shadow: 0 10px 40px rgba(0,0,0,.6); opacity: 0; transition: opacity .6s ease;
    pointer-events: none; min-width: min(30em, 80vw); }
#strobe.on { opacity: 1; }
#strobe .w { font-variant-caps: all-small-caps; letter-spacing: .16em; font-weight: 600; color: var(--hazard);
    font-size: clamp(14px, 1.3vw, 22px); }
#strobe .h { font-family: 'Cinzel', serif; font-weight: 600; color: var(--ink); font-size: clamp(22px, 2.6vw, 46px);
    letter-spacing: .04em; margin-top: .1em; }
#strobe .d { font-style: italic; color: var(--text-muted); font-size: clamp(14px, 1.3vw, 22px); margin-top: .2em; }
#strobe .n { font-family: 'Cinzel', serif; font-weight: 600; color: var(--hazard); font-size: clamp(40px, 6vw, 110px);
    line-height: 1; margin-top: .25em; font-variant-numeric: tabular-nums; }

/* the Triscenorama: the three-way portrait as a folded card in 3D (after the
   Triscenorama page): slices of the middle picture face us, and between them
   fronds stand out at right angles carrying the left and right pictures */
#tris { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 11vh; padding-bottom: 12vh; opacity: 0; pointer-events: none; transition: opacity 2s ease; }
#tris.on { opacity: 1; pointer-events: auto; }
.tris-view { flex: none; }
.tris-model { position: relative; display: flex; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform 3.2s cubic-bezier(.45, 0, .25, 1); }
.tris-model.instant { transition: none; }
.tris-model .slice { position: relative; height: 100%; transform-style: preserve-3d; }
.tris-model .pane { position: absolute; top: 0; height: 100%; background-repeat: no-repeat; backface-visibility: hidden;
    background-color: #000; filter: sepia(.18) brightness(.88) contrast(1.06); }
.tris-model .pane-left { transform-origin: left; }
.tris-model .pane-right { transform-origin: right; }
.tris-model .pane-side { filter: sepia(.18) brightness(.8) contrast(1.06); }
.tris-buttons { display: flex; gap: 10px; position: relative; z-index: 2; }
.tris-controls { display: flex; flex-direction: column; align-items: center; gap: 1.6vh; }
#tris-angle { width: min(420px, 60vw); accent-color: var(--fill-tan); position: relative; z-index: 2;
    direction: rtl; cursor: pointer; }
.tris-buttons button { font: 600 clamp(14px, 1.2vw, 20px) 'Crimson Text', Georgia, serif; font-variant-caps: all-small-caps;
    letter-spacing: .08em; color: var(--ink); background: var(--paper); border: 1px solid var(--card-edge);
    border-radius: 3px; padding: .3em 1em .4em; cursor: pointer; }
.tris-buttons button:hover { background: var(--fill-tan); }
.tris-buttons button.on { background: var(--ink); color: var(--paper-light); border-color: var(--ink); }
.tris-buttons button:focus-visible { outline: 2px solid var(--fill-tan); outline-offset: 2px; }
#vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.35) 75%, rgba(0,0,0,.72) 100%); }
/* a little darker and warmer than the scans, for mood */
#view { filter: sepia(.18) brightness(.88) contrast(1.06); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: #a89c85;
    font-style: italic; pointer-events: none; }

/* caption: the picture's attribution, as in the book's image credits  */
#caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 4vw 3.2vh;
    background: linear-gradient(transparent, rgba(0,0,0,.72)); pointer-events: none;
    color: var(--paper-light); opacity: 0; transition: opacity 3s ease; }
#caption.on { opacity: 1; }
#caption .t { font-family: 'Cinzel', serif; font-weight: 600; font-size: clamp(18px, 2.5vw, 44px);
    letter-spacing: .04em; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
#caption .c { font-style: italic; color: #e6dcc4; font-size: clamp(13px, 1.35vw, 24px); max-width: 62em;
    text-shadow: 0 1px 6px rgba(0,0,0,.7); }
#caption .c em { font-style: normal; }
#caption .u { font-family: 'Courier Prime', monospace; color: var(--fill-tan); font-size: clamp(12px, 1.1vw, 20px);
    margin-top: .3em; letter-spacing: .02em; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
#caption .where { font-variant-caps: all-small-caps; letter-spacing: .08em; font-weight: 600;
    color: var(--fill-tan); font-size: clamp(13px, 1.3vw, 23px); margin-top: .25em; }

/* ---------- the stereograph button ---------- */
#toggle { position: fixed; right: 14px; bottom: 14px; z-index: 20; width: 50px; height: 32px; padding: 0;
    display: grid; place-items: center; cursor: pointer; border-radius: 4px;
    background: rgba(239,230,210,.14); border: 1px solid rgba(239,230,210,.25);
    opacity: .6; transition: opacity .3s, background .3s, border-color .3s; }
#toggle:hover { opacity: 1; }
body.open #toggle { opacity: 1; background: var(--paper); border-color: var(--ink); }
#toggle svg { width: 40px; height: 24px; display: block; }
#toggle:focus-visible { outline: 2px solid var(--fill-tan); outline-offset: 2px; }

/* ---------- the list of photographs: a sheet from the book ---------- */
#sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 94vw); z-index: 10;
    background: var(--paper); color: var(--text); box-shadow: -8px 0 30px rgba(0,0,0,.45);
    display: flex; flex-direction: column; transform: translateX(105%);
    transition: transform .45s cubic-bezier(.2,.7,.2,1); }
body.open #sheet { transform: none; }
#sheet header { padding: 22px 22px 12px; border-bottom: 1px solid var(--card-edge); }
#sheet h1 { margin: 0; font-family: 'Cinzel', serif; font-weight: 600; color: var(--ink);
    font-size: 22px; letter-spacing: .04em; line-height: 1.15; }
#sheet header p { margin: 4px 0 0; font-size: 14px; color: var(--text-muted); font-style: italic; line-height: 1.35; }
#list { flex: 1; overflow-y: auto; padding: 4px 0 18px; scrollbar-width: thin; }

/* a part: a painted ink band, like the act bands at the head of each part */
.part { margin: 18px 16px 4px; position: relative; padding: 7px 14px 6px; color: var(--paper-light);
    font-family: 'Cinzel', serif; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.part::before { content: ''; position: absolute; inset: 0; background: var(--band);
    border-radius: 14% 9% 11% 10% / 50%; z-index: -1; }
.part .num { font-size: 12px; letter-spacing: 3px; opacity: .85; }
.part .name { font-size: 16px; letter-spacing: 1.5px; }
.part.extra::before { background: var(--text-muted); }
.part-rooms { margin: 3px 16px 0; text-align: center; font-variant: small-caps; letter-spacing: 1.5px;
    font-size: 12px; color: var(--ink); }
#list { isolation: isolate; }

/* a page (or handout) within the part */
.page-head { margin: 14px 22px 4px; font-variant-caps: all-small-caps; letter-spacing: .08em;
    font-weight: 600; color: var(--ink); font-size: 15px; display: flex; gap: 8px; align-items: baseline;
    border-bottom: 1px solid var(--card-edge); padding-bottom: 2px; }
.page-head .pg { color: var(--hazard); }

/* a photograph */
.photo { display: block; width: 100%;
    padding: 0; margin: 0; border: 0; background: none;
    text-align: left; font: inherit; color: inherit; }
.photo:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.photo .t { display: block; font-weight: 600; font-size: 16px; line-height: 1.2; color: var(--text); }
.photo .c { font-size: 13px; line-height: 1.3; color: var(--text-muted); font-style: italic; margin-top: 1px; }
.photo .refs { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.handout-label { font-variant-caps: all-small-caps; letter-spacing: .08em; font-weight: 600;
    color: var(--ink); font-size: 14px; white-space: nowrap; }
.handout-label::before { content: '\261E\00a0'; font-variant-caps: normal; font-weight: 400; }
.handout-label .handout-letter::after { content: ':'; }
.handout-label.page-ref::before { content: none; }
.photo .t .handout-label { font-size: 15px; }
.handout-sheet { font-size: 12px; font-weight: 400; color: var(--text-muted); white-space: nowrap; }
.handouts-gap { height: 4px; }
.handout-ref { font-size: 14px; font-weight: 600; color: var(--text); }
.item.current .now { display: inline; }
.now { display: none; font-variant-caps: all-small-caps; letter-spacing: .1em; color: var(--hazard);
    font-weight: 600; font-size: 13px; margin-left: 6px; }

.item { display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: center;
    padding: 8px 14px 8px 19px; border-left: 3px solid transparent; }
.item.current { background: var(--fill-tan-soft); border-left-color: var(--ink); }
.item .thumb { display: block; width: 84px; }
.item .thumb img { width: 84px; height: auto; max-height: 130px; object-fit: contain; display: block;
    border: 1px solid var(--card-edge); background: #000; filter: sepia(.15); }
.item .thumb:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.item .orig { display: block; margin-top: 3px; font-size: 12px; line-height: 1.2; color: var(--ink-soft);
    font-variant-caps: all-small-caps; letter-spacing: .06em; font-weight: 600; text-decoration: none; }
.item .orig:hover { text-decoration: underline; color: var(--ink); }
.item .photo { padding: 0; }
.item .photo:hover { background: none; }
.modes { display: flex; flex-direction: column; gap: 4px; }
.modes button { font: 600 13px 'Crimson Text', Georgia, serif; font-variant-caps: all-small-caps; letter-spacing: .06em;
    color: var(--ink); background: var(--paper-light); border: 1px solid var(--ink-soft); border-radius: 3px;
    padding: 3px 8px 4px; cursor: pointer; white-space: nowrap; text-align: center; }
.modes button:hover { background: var(--fill-tan); }
.modes button.on { background: var(--ink); color: var(--paper-light); }
.modes button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
#sheet footer { padding: 10px 22px 14px 22px; border-top: 1px solid var(--card-edge); display: flex; gap: 8px;
    align-items: center; padding-right: 76px; }
#sheet footer button { font: 600 14px 'Crimson Text', Georgia, serif; font-variant-caps: all-small-caps;
    letter-spacing: .08em; color: var(--ink); background: var(--paper-light); border: 1px solid var(--ink-soft);
    border-radius: 3px; padding: 5px 12px 6px; cursor: pointer; white-space: nowrap; }
#sheet footer button:hover { background: var(--fill-tan-soft); }
#sheet footer button.on { background: var(--ink); color: var(--paper-light); }
#sheet footer .keys { font-size: 12px; color: var(--text-muted); margin-left: auto; line-height: 1.25; text-align: right; }
</style>
</head>
<body>

<div id="stage" aria-label="Photograph">
    <canvas id="view"></canvas>
    <div id="tris" aria-label="Triscenorama">
        <div class="tris-view"><div class="tris-model"></div></div>
        <div class="tris-controls">
        <div class="tris-buttons" role="group" aria-label="Which side to look from">
            <button data-view="left">Left view</button><button data-view="middle">Middle view</button><button data-view="right">Right view</button>
        </div>
        <input type="range" id="tris-angle" min="-80" max="80" step="0.5" value="45" aria-label="Turn the portrait">
        </div>
    </div>
    <div id="vignette"></div>
    <div id="strobe" role="alert" aria-live="assertive">
        <div class="w">Warning</div>
        <div class="h">Mild strobe effect</div>
        <div class="d">This picture will flicker between its two views</div>
        <div class="n"></div>
    </div>
    <div id="caption"><div class="c"></div><div class="u"></div></div>
    <div id="loading">Loading…</div>
</div>

<aside id="sheet" aria-label="Photographs">
    <header>
        <h1>To the Cyclorama!</h1>
        <p><a href="../" style="color:inherit">Back to the main page</a></p>
    </header>
    <div id="list"></div>
    <footer>
        <button id="b-pause" title="Hold the picture still (Space)">Pause</button>
        <button id="b-fs" title="Full screen (F)">Full screen</button>
        <span class="keys">H this list · 1 the cover · S still<br>Z zoom · K Ken Burns · W wiggle</span>
    </footer>
</aside>

<button id="toggle" title="Photographs (H)" aria-label="Show or hide the photographs" aria-expanded="false" aria-controls="sheet">
    <!-- a stereograph card: two arched views side by side -->
    <svg viewBox="0 0 40 24" aria-hidden="true">
        <rect x="0.75" y="0.75" width="38.5" height="22.5" rx="2.5" fill="#efe6d2" stroke="#003153" stroke-width="1.5"/>
        <path d="M4.5 20V9.5a6 6 0 0 1 12 0V20Z M23.5 20V9.5a6 6 0 0 1 12 0V20Z" fill="#2f2a22"/>
        <path d="M6 19l3.4-4.6 2.2 2.8 1.6-1.6 2.3 3.4Z M25 19l3.4-4.6 2.2 2.8 1.6-1.6 2.3 3.4Z" fill="#a89c85"/>
        <circle cx="13" cy="8.6" r="1.3" fill="#e7cea2"/><circle cx="32" cy="8.6" r="1.3" fill="#e7cea2"/>
    </svg>
</button>

<script>
/* ---------- the book's structure ---------- */
const PARTS = [
  { num: '', name: 'Cover' },
  { num: 'Part I', name: 'Arrival', rooms: 'Getting Started · The Barry Stereograph · The Front Steps' },
  { num: 'Part II', name: 'The Library', rooms: 'Floorplans · Public Library · Research · The Chief Shusher’s Card' },
  { num: 'Part III', name: 'Gallery & Museum', rooms: 'Verdon · Stawell · Latrobe · McArthur · McCoy Hall (Museum)' },
  { num: 'Part IV', name: 'The Basement', rooms: 'Storeroom · A Dead Body' },
  { num: 'Part V', name: 'Cyclorama', rooms: 'Arrival · The Exhibit Comes Alive · The Battle · Getting Out', red: true },
  { num: 'Part VI', name: 'Epilogue' },
  { num: '', name: 'Handouts', rooms: 'For the players, lettered in the order they are given out' },
  { num: '', name: 'Appendix', rooms: 'Triscenorama · Triscenorama Portrait' },
];

/* ---------- the photographs and their loops ----------
   part: index into PARTS. page / pageTitle: where it is in the book.
   refs: other places it appears (handouts as [letter, title]).
   shots: the loop, played in order and round again. Each shot moves the
   camera from a to b over d seconds; a camera is [x, y, zoom]: the point
   of the picture at the centre of the screen (fractions across and down)
   and the zoom (1 = the picture just fills the screen); d is stretched by
   PACE below, so each shot here plays for twice as long. Shots dissolve
   into each other, so the picture never stops moving.
   safe: [left, top, right, bottom], the part of a scan the camera may show,
   so a mount, border or torn edge never comes into view. */
const IMAGES = [
  { id: 'cover', part: 0, page: 1, pageTitle: 'Cover', t: 'To the Cyclorama',
    shots: [
      { a: [.50, .10, 1.50], b: [.50, .12, 1.20], d: 14 },   // the title
      { a: [.25, .47, 1.70], b: [.75, .47, 1.70], d: 16 },   // across the slices of the battle
      { a: [.50, .62, 1.30], b: [.50, .30, 1.00], d: 15 },   // up from the light, out to the cover
    ] },
  { id: 'barry_full', part: 1, page: 4, pageTitle: 'Getting Started',
    t: 'Sir Redmond Barry', c: 'Lithograph portrait, between 1840 and 1860',
    shots: [
      { a: [.48, .84, 1.00], b: [.45, .30, 1.00], d: 18 },   // up from the signature to his face
      { a: [.45, .30, 1.30], b: [.45, .29, 2.10], d: 13 },   // that stare
      { a: [.20, .66, 1.70], b: [.80, .62, 1.70], d: 15 },   // along the ermine
      { a: [.38, .90, 1.35], b: [.52, .90, 1.35], d: 13 },   // "Very truly yours, Redmond Barry"
      { a: [.45, .40, 1.40], b: [.50, .50, 1.00], d: 13 },   // the whole sheet
    ] },
  { id: 'FL16281605', part: 1, page: 5, pageTitle: 'The Barry Stereograph', safe: [.01, .02, .99, .98],
    t: 'The Barry Stereograph', c: 'Bust of Sir Redmond Barry, stereograph by B. C. Boake',
    shots: [
      { a: [.23, .58, 1.70], b: [.23, .42, 1.70], d: 14 },   // up the bust to his face
      { a: [.23, .40, 1.50], b: [.68, .40, 1.50], d: 16 },   // across to the other eye’s view
      { a: [.95, .25, 1.80], b: [.95, .78, 1.80], d: 14 },   // down the label: Melbourne Art Gallery & Museum Series, “Sir R Barry 19”
      { a: [.94, .60, 1.60], b: [.50, .50, 1.00], d: 13 },   // the whole card
    ] },
  { id: 'mp003283', part: 1, page: 6, pageTitle: 'Melbourne from the Air',
    t: 'Melbourne from the Air', c: 'The State Library and the Exhibition Building, Airspy, c. 1927', safe: [.045, .04, .955, .94],
    shots: [
      { a: [.50, .50, 1.15], b: [.48, .46, 1.40], d: 12 },   // the city, settling in
      { a: [.47, .47, 1.90], b: [.47, .45, 2.80], d: 12 },   // down onto the Library's dome
      { a: [.47, .42, 2.40], b: [.53, .17, 2.40], d: 13 },   // up Russell Street to the Exhibition Building
      { a: [.54, .17, 2.60], b: [.50, .42, 1.18], d: 14 },   // and back out over the city
    ] },
  { id: 'a14166', part: 1, page: 7, pageTitle: 'The Front Steps', refs: [['A', 'Melbourne']],
    t: 'Joan of Arc', c: 'Outside the State Library, stereograph, 1918',
    shots: [
      { a: [.24, .52, 2.40], b: [.28, .52, 1.60], d: 11 },   // the lion's face
      { a: [.47, .47, 2.10], b: [.40, .32, 2.10], d: 12 },   // up Joan and her horse to the banner
      { a: [.48, .40, 1.70], b: [.82, .66, 2.30], d: 13 },   // across to the woman on the lawn
      { a: [.82, .68, 2.40], b: [.50, .50, 1.05], d: 13 },   // the whole forecourt
    ] },
  { id: 'a14167', part: 1, page: 7, pageTitle: 'The Front Steps', refs: [['A', 'Melbourne']],
    t: 'St George and the Dragon', c: 'Outside the State Library, stereograph, 1918',
    shots: [
      { a: [.43, .60, 2.20], b: [.40, .26, 2.20], d: 13 },   // up from the dragon to the rearing horse
      { a: [.45, .34, 1.80], b: [.47, .33, 2.60], d: 10 },   // in on St George
      { a: [.62, .25, 1.70], b: [.84, .06, 2.00], d: 12 },   // along the columns to MELBOURNE
      { a: [.16, .86, 2.60], b: [.50, .50, 1.05], d: 14 },   // from the woman in the hat, out to the portico
    ] },
  { id: 'joanNew_tall', part: 1, page: 7, pageTitle: 'The Front Steps',
    t: 'Joan of Arc', c: 'The statue outside the State Library today',
    shots: [
      { a: [.22, .80, 1.10], b: [.18, .45, 1.10], d: 15 },   // up the horse’s neck to its armoured head
      { a: [.88, .78, 1.10], b: [.87, .52, 1.35], d: 14 },   // up Joan to her face
      { a: [.70, .55, 1.20], b: [.80, .32, 1.20], d: 14 },   // up the lance towards the banner
      { a: [.22, .42, 1.30], b: [.50, .55, 1.00], d: 14 },   // from the horse’s head, out
    ] },
  { id: 'FL15580455', part: 2, page: 9, pageTitle: 'Public Library',
    t: 'The Domed Reading Room', c: 'Elevated view, State Library of Victoria, about 1922',
    shots: [
      { a: [.50, .30, 1.30], b: [.50, .70, 1.30], d: 16 },   // down the galleries to the desks
      { a: [.50, .75, 1.60], b: [.48, .80, 2.40], d: 13 },   // into the central desk
      { a: [.15, .80, 2.00], b: [.85, .78, 2.00], d: 16 },   // across the readers
      { a: [.48, .42, 2.20], b: [.48, .36, 2.80], d: 12 },   // the clock above the doorway
      { a: [.85, .25, 1.80], b: [.50, .50, 1.00], d: 14 },   // from the book galleries, out
    ] },
  { id: 'FL15681165', part: 2, page: 10, pageTitle: 'Research in the Library', refs: [['A', 'Melbourne']], safe: [.02, .04, .985, .975],
    t: 'Russell Street, Melbourne', c: 'Stereograph, about 1900 to 1920',
    shots: [
      { a: [.20, .68, 1.60], b: [.30, .45, 1.60], d: 15 },   // from the man in the street, up towards the spires

/* ---------- engine ----------
   The pictures are drawn onto one canvas the size of the window. Each picture
   is kept as a small pyramid of copies, each half the size of the last, and
   every frame is drawn from the copy nearest the size it is shown at: a big
   scan squeezed onto the screen in one step shimmers and crawls as it moves,
   which is what made the old version look juttery. */
const FADE = 4500;                            // a long, slow dissolve between shots, ms
const PACE = 2;                               // every shot's d is stretched by this: slow and moody
const $ = id => document.getElementById(id);
const stage = $('stage'), cap = $('caption'), canvas = $('view'), ctx = canvas.getContext('2d', { alpha: false });
const layers = [{ anim: null, pic: null, on: false, t0: 0 }, { anim: null, pic: null, on: false, t0: 0 }];
let front = 0, cur = -1, shot = 0, mode = 'kb', paused = false, lastFrame = 0, token = 0, fadeMs = FADE, clock = 0;
const cache = {};
const src = im => `images/kenburns/${im.file || im.id}.jpg`;
let saved = 0;
try { saved = Math.max(0, IMAGES.findIndex(im => im.id === localStorage.getItem('kenburns-photo'))); } catch (e) {}

// the picture and its halvings, down to about 400 px across
function pyramid(img) {
    const levels = [{ bmp: img, k: 1 }];
    let w = img.naturalWidth, h = img.naturalHeight, from = img, k = 1;
    while (Math.max(w, h) > 800) {
        w = Math.round(w / 2); h = Math.round(h / 2); k /= 2;
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(from, 0, 0, w, h);
        levels.push({ bmp: c, k }); from = c;
    }
    return { w: img.naturalWidth, h: img.naturalHeight, levels };
}
function loadUrl(url) {
    if (!cache[url]) cache[url] = new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()).then(() => res(pyramid(i)));
        i.onerror = () => { delete cache[url]; rej(); }; i.src = url;
    });
    return cache[url];
}
const load = im => loadUrl(src(im));

/* "Wiggle": the stereograph's two views shown in turn, like the wigglegram
   maker: A, a moment of both, B, a moment of both, and round again. The two
   views were cut from the card and lined up on its subject beforehand
   (images/kenburns/wiggle/w-<id>-a.jpg and -b.jpg), so the subject holds
   still and everything nearer or further rocks around it. */
const WIGGLE = new Set(["a14166", "a14167", "b53623", "b53624", "b53628", "b53631", "b53632", "b53634", "b53635", "b53636", "FL16281605", "FL15681165", "FL15960677", "b53625", "chiefShusher_pair", "dome_pair", "barry_painting_pair", "latrobe_pair"]);
const WIGGLE_HOLD = 300, WIGGLE_BLEND = WIGGLE_HOLD * .3;   // ms, as in the wigglegram maker
const WIGGLE_WARN = 5000;                     // ms of warning and countdown before it starts flickering
const WIGGLE_SECS = 15;                       // then it stops flickering: the cover, a fresh warning, and again
const wiggleSrc = (im, ab) => `images/kenburns/wiggle/w-${im.id}-${ab}.jpg`;
const ease = t => -(Math.cos(Math.PI * t) - 1) / 2;   // slow in, slow out
const W = () => stage.clientWidth, H = () => stage.clientHeight;

// where the picture sits for camera v = [x, y, zoom]; clamped so no edge shows
function place(v, im, natW, natH) {
    const [x0, y0, x1, y1] = im.safe || [0, 0, 1, 1];
    const s = Math.max(W() / (natW * (x1 - x0)), H() / (natH * (y1 - y0))) * Math.max(1, v[2]);
    const dw = natW * s, dh = natH * s;
    const tx = Math.min(-x0 * dw, Math.max(W() - x1 * dw, W() / 2 - v[0] * dw));
    const ty = Math.min(-y0 * dh, Math.max(H() - y1 * dh, H() / 2 - v[1] * dh));
    return { s, tx, ty };
}
// the camera that is actually seen once clamped, so a move runs at an even pace
// instead of stalling against an edge and then lurching off it
function settle(v, im, pic) {
    const g = place(v, im, pic.w, pic.h);
    return [(W() / 2 - g.tx) / (pic.w * g.s), (H() / 2 - g.ty) / (pic.h * g.s), Math.max(1, v[2])];
}
function geometry(L) {

        return { s, tx: (W() - P.w * s) / 2, ty: (H() - P.h * s) / 2 };
    }
    const t = ease(Math.min(1, a.elapsed / a.dur));
    if (a.zoom) return zoomAt(a, P, t);
    if (a.w !== W() || a.h !== H()) {          // (re)fit the move to the window
        a.p = settle(a.from, a.im, P); a.q = settle(a.to, a.im, P); a.w = W(); a.h = H();
    }
    const p = a.p, q = a.q;
    const v = [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t,
               Math.exp(Math.log(p[2]) + (Math.log(q[2]) - Math.log(p[2])) * t)];   // zoom at an even pace
    return place(v, a.im, P.w, P.h);
}

// "Zoom in slowly": from the whole picture, letterboxed, one long push in
// towards the picture's key detail (ZOOMS), then it holds there
const ZOOM_SECS = 40, ZOOM_TO = 1.7;

    if (my !== token) return;

function focusOf(im) {
    if (ZOOMS[im.id]) return ZOOMS[im.id];
    let best = im.shots[0].b;
    for (const sh of im.shots) for (const v of [sh.a, sh.b]) if (v[2] > best[2]) best = v;

function zoomAt(a, P, t) {
    const nw = P.w, nh = P.h, Wd = W(), Hd = H();
    const s0 = Math.min(Wd / nw, Hd / nh), end = place(a.focus, a.im, nw, nh);

// paint both layers: the one fading out underneath, the one fading in on top
function paint() {
    const dpr = window.devicePixelRatio || 1, cw = Math.round(W() * dpr), ch = Math.round(H() * dpr);
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
    ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, ch);
    for (const L of [layers[1 - front], layers[front]]) {
        if (!L.anim || !L.pic) continue;
        const f = fadeMs ? Math.min(1, (clock - L.t0) / fadeMs) : 1;
        const alpha = L.on ? ease(f) : 1 - ease(f);
        if (alpha <= 0.001) { if (!L.on) L.anim = null; continue; }
        const g = geometry(L), a = L.anim;
        if (!a.wiggle) { drawPic(L.pic, g, alpha, dpr); continue; }
        const t = a.elapsed < WIGGLE_WARN ? 0 : (a.elapsed - WIGGLE_WARN) % (2 * (WIGGLE_HOLD + WIGGLE_BLEND));
        const showB = t >= WIGGLE_HOLD + WIGGLE_BLEND && t < 2 * WIGGLE_HOLD + WIGGLE_BLEND;
        const both = (t >= WIGGLE_HOLD && t < WIGGLE_HOLD + WIGGLE_BLEND) || t >= 2 * WIGGLE_HOLD + WIGGLE_BLEND;
        drawPic(showB ? a.picB : L.pic, g, alpha, dpr);
        if (both) drawPic(a.picB, g, alpha * .5, dpr);
    }
}
function drawPic(P, g, alpha, dpr) {
    const sd = g.s * dpr;
    // the smallest copy that is still at least as big as it will be drawn
    let lv = P.levels[0];
    for (const l of P.levels) if (l.k >= sd) lv = l;
    ctx.globalAlpha = alpha;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(lv.bmp, g.tx * dpr, g.ty * dpr, P.w * sd, P.h * sd);
}
const draw = () => paint();                   // (kept for the frame-checking scripts)

/* ---------- the Triscenorama ---------- */
const TRIS_SLICES = 12;                       // slices across the portrait, with a frond between each pair
const TRIS_TURN = 45;                         // how far it turns for the left and right views, degrees
const trisEl = $('tris'), trisModel = trisEl.querySelector('.tris-model'), trisView = trisEl.querySelector('.tris-view');
let trisBuilt = null, trisSide = 'left';
function buildTris(im) {
    // as big as fits above the buttons, at the pictures' 4:3
    const vh = Math.min(H() * .6, W() * .6 * 3 / 4), vw = vh * 4 / 3, key = im.id + vw.toFixed(1);
    if (trisBuilt === key) return;
    trisBuilt = key;
    trisView.style.width = vw + 'px'; trisView.style.height = vh + 'px';
    trisView.style.perspective = (vw * 3.1) + 'px';
    trisModel.innerHTML = '';
    const sw = vw / TRIS_SLICES, depth = sw, thick = Math.max(1, vw / 480);   // fronds stand out one slice
    const urls = im.tris.map(f => `images/kenburns/${f}.jpg`);
    for (let i = 0; i < TRIS_SLICES; i++) {
        const g = document.createElement('div');
        g.className = 'slice'; g.style.width = sw + 'px';
        urls.forEach((u, idx) => {
            const p = document.createElement('div'), side = idx !== 1, k = side ? depth / sw : 1;
            p.className = 'pane ' + ['pane-left pane-side', 'pane-center', 'pane-right pane-side'][idx];
            p.style.width = (side ? depth : sw) + 'px';
            if (idx === 0) p.style.transform = `translateX(${-thick / 2}px) rotateY(-90deg)`;
            if (idx === 2) { p.style.left = (sw - depth) + 'px'; p.style.transform = `translateX(${thick / 2}px) rotateY(90deg)`; }
            p.style.backgroundImage = `url(${u})`;
            p.style.backgroundSize = `${vw * k}px ${vh}px`;
            p.style.backgroundPosition = `${-i * sw * k}px 0px`;
            g.appendChild(p);
        });
        const edge = x => {                      // the frond's paper edge, seen face on
            const e = document.createElement('div');
            e.className = 'pane'; e.style.width = thick + 'px'; e.style.left = x + 'px';
            e.style.background = '#efe6d2'; e.style.filter = 'brightness(.75)';
            e.style.transform = `translateZ(${depth}px)`; g.appendChild(e);
        };
        edge(-thick / 2);
        if (i === TRIS_SLICES - 1) edge(sw - thick / 2);
        trisModel.appendChild(g);
    }
}
function trisAngle(deg, instant) {             // turn to any angle: + shows the left picture, - the right
    trisModel.classList.toggle('instant', !!instant);
    trisModel.style.transform = `rotateY(${deg}deg)`;
    if (instant) void trisModel.offsetWidth;
    trisModel.classList.remove('instant');
    trisSlider.value = deg;
}
const trisSlider = $('tris-angle');
trisSlider.oninput = () => {                    // fine control: follows the slider straight away
    trisAngle(+trisSlider.value, true);
    trisSide = null;
    trisEl.querySelectorAll('.tris-buttons button').forEach(b => b.classList.remove('on'));
};
function trisTurn(side, instant) {
    trisSide = side;
    trisSlider.value = ({ left: TRIS_TURN, middle: 0, right: -TRIS_TURN })[side];
    trisModel.classList.toggle('instant', !!instant);
    trisModel.style.transform = `rotateY(${({ left: TRIS_TURN, middle: 0, right: -TRIS_TURN })[side]}deg)`;
    if (instant) void trisModel.offsetWidth;
    trisModel.classList.remove('instant');
    trisEl.querySelectorAll('.tris-buttons button').forEach(b => b.classList.toggle('on', b.dataset.view === side));
    document.querySelectorAll('.item').forEach(el => { const i = +el.dataset.i;
        el.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', i === cur && mode === 'tris' && b.dataset.view === side)); });
}
trisEl.querySelectorAll('.tris-buttons button').forEach(b => b.onclick = () => trisTurn(b.dataset.view));
window.addEventListener('resize', () => { if (mode === 'tris') buildTris(IMAGES[cur]); });

function showTris(index, opts) {
    const im = IMAGES[index], changed = index !== cur;
    ++token; cur = index; mode = 'tris';
    for (const L of layers) if (L.anim) L.anim.handed = true;   // the loop underneath stops moving on
    buildTris(im);
    trisTurn(opts.view || 'left', true);
    trisEl.classList.add('on');
    $('loading').style.display = 'none';
    if (changed) try { localStorage.setItem('kenburns-photo', im.id); } catch (e) {}
    caption(im, opts.cut);
    document.querySelectorAll('.item').forEach(el => el.classList.toggle('current', +el.dataset.i === cur));
    if (trisSide) trisTurn(trisSide, true);
}

async function show(index, n = 0, opts = {}) {
    if (IMAGES[index].tris) return showTris(index, opts);
    trisEl.classList.remove('on');
    const im = IMAGES[index], my = ++token, changed = index !== cur;
    mode = opts.mode || 'kb';
    const still = mode === 'still';
    cur = index; shot = n % im.shots.length;
    if (mode === 'wiggle' && !WIGGLE.has(im.id)) mode = 'kb';
    let pic, picB;
    try {
        if (mode === 'wiggle') [pic, picB] = await Promise.all([loadUrl(wiggleSrc(im, 'a')), loadUrl(wiggleSrc(im, 'b'))]);
        else pic = await load(im);
    } catch { $('loading').textContent = `Could not load ${mode === 'wiggle' ? wiggleSrc(im, 'a') : src(im)}`; return; }
    if (my !== token) return;                  // another photograph was picked meanwhile
    $('loading').style.display = 'none';

    const sh = im.shots[shot], back = layers[1 - front], old = layers[front];
    back.pic = pic;
    back.anim = still ? { im, still: true, dur: 1, elapsed: 0, handed: true }
              : mode === 'wiggle' ? { im, wiggle: true, picB, dur: WIGGLE_WARN + WIGGLE_SECS * 1000, elapsed: 0, handed: false }
              : mode === 'zoom' ? { im, zoom: true, focus: focusOf(im), dur: ZOOM_SECS * 1000, elapsed: 0, handed: false }
                      : { im, from: sh.a, to: sh.b, dur: sh.d * PACE * 1000, elapsed: 0, handed: false };
    fadeMs = opts.cut ? 0 : FADE;
    back.on = true; back.t0 = clock; old.on = false; old.t0 = clock;
    if (opts.cut) old.anim = null;
    front = 1 - front;
    paint();

    if (changed) try { localStorage.setItem('kenburns-photo', im.id); } catch (e) {}
    if (changed || (opts.mode && !opts.again)) caption(im, opts.cut);   // each new start, not each shot of the loop
    document.querySelectorAll('.item').forEach(el => { const i = +el.dataset.i;
        el.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', i === cur && b.dataset.mode === mode));
        el.classList.toggle('current', i === cur);
    });
}
function caption(im, now) {
    cap.classList.remove('on');
    clearTimeout(cap._in); clearTimeout(cap._out);
    if (!CREDITS[im.id]) return;               // the handouts are the book's own: no credit line
    cap._in = setTimeout(() => {
        cap.querySelector('.c').innerHTML = CREDITS[im.id];
        const ln = LINKS[im.id], bare = u => u.replace(/^https?:\/\//, '');
        cap.querySelector('.u').textContent = !ln ? '' : Array.isArray(ln[0]) ? ln.map(l => `${l[1]}: ${bare(l[0])}`).join('   ·   ') : bare(ln[0]);
        cap.classList.add('on');
        cap._out = setTimeout(() => cap.classList.remove('on'), 12000);
    }, now ? 300 : FADE * .5);
}
const handout = r => Array.isArray(r) ? `Handout ${r[0]}: ${r[1]}` : r;
const where = im => [im.handout ? `Handout ${im.handout}${im.sheet ? ` (${im.sheet})` : ''}` : im.page ? `p. ${im.page}  ${im.pageTitle}` : 'Not in the book', ...(im.refs || []).map(handout)];

function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min(100, now - (lastFrame || now));   // a hidden tab doesn't jump ahead
    lastFrame = now; clock += dt;
    for (const L of layers) {
        const a = L.anim; if (!a) continue;
        if (!paused) a.elapsed += dt;
        // start the next shot while this one is still moving, so the picture never stops
        if (L !== layers[front] || a.handed) continue;
        if (a.zoom) {                              // zoomed in: rest, then the cover (unless this is the cover)
            if (a.elapsed >= a.dur + ZOOM_HOLD) { a.handed = true; cur === COVER_I ? show(cur, 0, { mode: 'zoom', again: true }) : coverInterlude(); }
        } else if (a.wiggle) {                     // enough flicker: rest on the cover, then warn and wiggle again
            if (a.elapsed >= a.dur) { a.handed = true; coverInterlude('wiggle'); }
        } else if (a.interlude) {                  // the cover has had its moment: back to the same zoom or wiggle
            if (a.elapsed >= a.dur) { a.handed = true; show(cur, 0, { mode: a.interlude, again: true }); }
        } else if (a.elapsed >= a.dur - FADE) { a.handed = true; show(cur, shot + 1); }
    }
    paint();
    // the strobe warning and its countdown, while the wiggle waits to start
    const fa = layers[front].anim, warn = !!(fa && fa.wiggle && fa.elapsed < WIGGLE_WARN);
    strobe.classList.toggle('on', warn);
    if (warn) strobe.querySelector('.n').textContent = Math.ceil((WIGGLE_WARN - fa.elapsed) / 1000);
}
const strobe = $('strobe');
requestAnimationFrame(tick);

/* ---------- the list ---------- */
// Each handout is listed twice: on the page where players are first given it,
// and again with the others in the Handouts section.
const FIRST_GIVEN = {
    A: [1, 4, 'Getting Started'], B: [1, 4, 'Getting Started'], C: [2, 8, 'Library, Museum & Gallery'],
    D: [2, 10, 'Research in the Library'], E: [2, 11, 'Research in the Library (continued)'],
    F: [3, 21, 'Mr Roe, CSIR'], G: [4, 22, 'The Basement'], H: [5, 24, 'Inside the Cyclorama'], I: [6, 29, 'Whatever the Outcome'],
};
const entries = IMAGES.map((im, i) => ({ im, i, part: im.part, page: im.page || 0, pageTitle: im.pageTitle, n: i, dup: 0 }));
// and the three-way portrait sits with the Lalor portraits too, as well as in the Appendix
const ALSO_ON = { triscenorama: [3, 18, 'McArthur Gallery'] };
IMAGES.forEach((im, i) => {
    const f = (im.handout && FIRST_GIVEN[im.handout]) || ALSO_ON[im.id];
    if (f) entries.push({ im, i, part: f[0], page: f[1], pageTitle: f[2], n: i, dup: 1 });
});
entries.sort((x, y) => x.part - y.part || (x.part === 7 ? 0 : x.page - y.page) || x.dup - y.dup || x.n - y.n);

const list = $('list');
let lastPart = -1, lastPage;
for (const { im, i, part, page, pageTitle, dup } of entries) {
    if (part !== lastPart) {
        const P = PARTS[part];
        list.insertAdjacentHTML('beforeend',
            `<div class="part">${P.num ? `<span class="num">${P.num}</span>` : ''}<span class="name">${P.name}</span></div>`);
        lastPart = part; lastPage = undefined;
    }
    const pageKey = page + pageTitle;
    if ((dup || !im.handout) && pageKey !== lastPage) {
        list.insertAdjacentHTML('beforeend', page > 1
            ? `<div class="page-head"><span class="pg">p. ${page}</span><span>${pageTitle}</span></div>` : '');
        lastPage = pageKey;
    }
    const go = m => () => { setPaused(false); show(i, 0, { mode: m }); setOpen(false); };
    const item = document.createElement('div');
    item.className = 'item'; item.dataset.i = i;
    const link = LINKS[im.id];
    item.innerHTML = `<div><div class="thumb"><img src="images/kenburns/thumbs/${im.file || im.id}.jpg" alt="" loading="lazy"></div>${link
        ? (Array.isArray(link[0]) ? link : [link]).map(l => `<a class="orig" href="${l[0]}" target="_blank" rel="noopener" title="${l[0]}">${Array.isArray(link[0]) ? 'SLV ' + l[1].toLowerCase() : l[1]} ↗</a>`).join('') : ''}</div>
        <div class="photo"><span class="t">${im.handout ? `<span class="handout-label">Handout <span class="handout-letter">${im.handout}</span></span> ` : ''}${im.t}${im.sheet ? ` <span class="handout-sheet">(${im.sheet})</span>` : ''}</span><span class="now">now showing</span></div>
        <div class="modes" role="group" aria-label="How to show it">${im.tris ? `
            <button data-mode="tris" data-view="left" title="Turned to show the left picture">Left view</button>
            <button data-mode="tris" data-view="middle" title="Face on: the middle picture">Middle view</button>
            <button data-mode="tris" data-view="right" title="Turned to show the right picture">Right view</button>` : `
            <button data-mode="still" title="The whole picture full screen, without moving (S)">Still</button>
            <button data-mode="zoom" title="Starts with the whole picture and slowly zooms in, then the cover, and round again (Z)">Zoom in slowly</button>
            <button data-mode="kb" title="Its own loop of slow zooms and pans (K)">Ken Burns</button>${WIGGLE.has(im.id) ? `
            <button data-mode="wiggle" title="The stereograph's two views in turn, so it rocks in 3D: a warning, 15 seconds, then the cover, and round again (W)">Wiggle</button>` : ''}`}
        </div>`;
    item.querySelectorAll('.modes button').forEach(b => b.onclick = b.dataset.view
        ? () => { if (cur === i && mode === 'tris') trisTurn(b.dataset.view); else show(i, 0, { view: b.dataset.view }); setOpen(false); }
        : go(b.dataset.mode));
    list.appendChild(item);
}

/* ---------- controls ---------- */
function setOpen(open) {
    document.body.classList.toggle('open', open);
    $('toggle').setAttribute('aria-expanded', String(open));
    if (open) document.querySelector('.item.current')?.scrollIntoView({ block: 'nearest' });
}
function setPaused(p) {
    paused = p;
    $('b-pause').textContent = p ? 'Resume' : 'Pause';
    $('b-pause').classList.toggle('on', p);
}
$('toggle').onclick = () => setOpen(!document.body.classList.contains('open'));
$('b-pause').onclick = () => setPaused(!paused);
const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
$('b-fs').onclick = fs;
document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toUpperCase();
    if (k === 'H') setOpen(!document.body.classList.contains('open'));
    else if (k === ' ') { e.preventDefault(); setPaused(!paused); }
    else if (k === 'F') fs();
    else if (k === '1') { setPaused(false); show(COVER_I, 0, { mode: 'still' }); }
    else if (mode === 'tris') return;
    else if (k === 'S') show(cur, 0, { mode: 'still' });
    else if (k === 'Z') { setPaused(false); show(cur, 0, { mode: 'zoom' }); }
    else if (k === 'K') { setPaused(false); show(cur, 0, { mode: 'kb' }); }
    else if (k === 'W' && WIGGLE.has(IMAGES[cur].id)) { setPaused(false); show(cur, 0, { mode: 'wiggle' }); }
    else if (k === 'ESCAPE') setOpen(false);
});

show(saved, 0, { cut: true });
</script>
